<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html">Home Page</a>
    </nav>

    <h1>Menu</h1>

    <figure>
        <img src="menu.jpg" alt="Photo of coffee menu">
        <figcaption>Popular drinks and desserts</figcaption>
    </figure>

    <table>
        <caption>Coffee Shop Menu</caption>

        <tr>
            <th colspan="3">Drinks and Food</th>
        </tr>

        <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Latte</td>
            <td rowspan="2">Coffee</td>
            <td>$4</td>
        </tr>

        <tr>
            <td>Cappuccino</td>
            <td>$5</td>
        </tr>

        <tr>
            <td>Cheesecake</td>
            <td>Dessert</td>
            <td>$6</td>
        </tr>

    </table>

</body>
</html>

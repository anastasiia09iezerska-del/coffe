<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="main.html">Home Page</a>
    </nav>

    <h1>Gallery</h1>

    <div class="gallery-grid">

        <figure>
            <img src="latte.jpg" alt="Photo of latte" class="gallery_photo">
            <figcaption>Latte</figcaption>
        </figure>

        <figure>
            <img src="espresso.jpg" alt="Photo of espresso" class="gallery_photo">
            <figcaption>Espresso</figcaption>
        </figure>

        <figure>
            <img src="dessert.jpg" alt="Photo of dessert" class="gallery_photo">
            <figcaption>Dessert</figcaption>
        </figure>

        <figure>
            <img src="coffee_shop.jpg" alt="Photo of cafe interior" class="gallery_photo">
            <figcaption>Cafe Interior</figcaption>
        </figure>

    </div>

</body>
</html>
